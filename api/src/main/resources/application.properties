quarkus.application.name=volunteer-hours-service
quarkus.test.integration-test-profile=test

quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DEV_DB_USERNAME}
quarkus.datasource.password=${DEV_DB_PASSWORD}
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:55432/volunteer_hours

quarkus.hibernate-orm.schema-management.strategy=validate

quarkus.liquibase.migrate-at-start=true
quarkus.liquibase.change-log=db/changelog/db.changelog-master.yaml

quarkus.swagger-ui.always-include=true

%test.quarkus.datasource.db-kind=postgresql
%test.quarkus.datasource.username=${TEST_DB_USERNAME}
%test.quarkus.datasource.password=${TEST_DB_PASSWORD}
%test.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:55433/volunteer_hours_test

%test.quarkus.hibernate-orm.schema-management.strategy=validate
%test.quarkus.liquibase.migrate-at-start=true
%test.quarkus.liquibase.change-log=db/changelog/db.changelog-master.yaml